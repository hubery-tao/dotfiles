# make ESC instant in Vim
set -sg escape-time 0

# good TERM
set -g default-terminal "tmux-256color"
# Advertise true-colour support (compatible with tmux 2.7+).
set -ga terminal-overrides ",*:Tc"
# try the following if the above fails
# set -g default-terminal "screen-256color"

# Base16 Ayu Dark palette; keep tmux visually aligned with tinted-nvim.
set -g status-style "bg=#0b0e14,fg=#bfbdb6"
set -g message-style "bg=#11151c,fg=#bfbdb6"
set -g pane-border-style "fg=#565b66"
set -g pane-active-border-style "fg=#59c2ff"
set -g window-status-style "bg=#11151c,fg=#565b66"
set -g window-status-current-style "bg=#59c2ff,fg=#0b0e14,bold"

# let tmux set/forward clipboard sequences
set -s set-clipboard on
